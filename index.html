<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>hmmodz ai - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body {
            background: #0b0e14;
            background-image: radial-gradient(at 0% 0%, rgba(20, 33, 61, 1) 0, transparent 50%), radial-gradient(at 100% 100%, rgba(0, 119, 182, 0.15) 0, transparent 50%);
            color: #f8f9fa; min-height: 100vh; display: flex; padding: 25px;
        }
        .container { width: 100%; max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: 280px 1fr; gap: 25px; }
        .sidebar { background: rgba(15, 20, 32, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; transition: transform 0.3s ease; }
        .logo-section h2 { font-size: 1.5rem; letter-spacing: 1px; background: linear-gradient(to right, #fff, #778da9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
        .logo-placeholder { width: 70px; height: 70px; background: linear-gradient(135deg, #0077b6, #00b4d8); border-radius: 22px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; font-size: 2rem; box-shadow: 0 10px 30px rgba(0, 119, 182, 0.4); }
        .nav-item { padding: 15px 25px; color: #94a3b8; border-radius: 15px; cursor: pointer; width: 100%; transition: background 0.2s, color 0.2s; display: flex; align-items: center; }
        .nav-item i { margin-right: 12px; width: 20px; text-align: center; }
        .nav-item.active { background: rgba(0, 180, 216, 0.1); color: #00b4d8; font-weight: 600; }
        .nav-item:hover:not(.active) { background: rgba(255, 255, 255, 0.04); }
        .main-content { display: flex; flex-direction: column; gap: 25px; }
        .view { display: none; flex-direction: column; gap: 25px; }
        .view.active { display: flex; }
        .user-list { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; padding: 30px; margin-top: 10px; }
        .user-item { display: flex; align-items: center; padding: 18px; margin-bottom: 12px; border-radius: 20px; transition: background 0.2s, border-color 0.2s, transform 0.2s; border: 1px solid transparent; cursor: pointer; }
        .user-item:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(0, 180, 216, 0.25); transform: translateY(-2px); }
        .profile-img-container { width: 55px; height: 55px; border-radius: 16px; margin-right: 18px; overflow: hidden; border: 2px solid rgba(0, 180, 216, 0.3); background: #1e293b; flex-shrink: 0; }
        .profile-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .user-info { min-width: 0; flex: 1; padding-right: 15px; }
        .user-info h4 { font-size: 1.05rem; color: #ffffff; font-weight: 600; }
        .user-info p { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
        .badge { margin-left: auto; padding: 6px 14px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; background: rgba(0, 180, 216, 0.15); color: #00b4d8; flex-shrink: 0; }
        .settings-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; padding: 30px; }
        .settings-card label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .settings-card input { width: 100%; padding: 14px 16px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.04); color: #f8f9fa; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        .settings-card input:focus { border-color: #00b4d8; }
        .btn { border: none; cursor: pointer; font-weight: 600; border-radius: 14px; padding: 12px 22px; font-size: 0.9rem; transition: transform 0.15s ease, opacity 0.15s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: linear-gradient(135deg, #0077b6, #00b4d8); color: #fff; }
        .btn-ghost { background: rgba(255, 255, 255, 0.06); color: #f8f9fa; }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .settings-row { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
        .settings-hint { font-size: 0.8rem; color: #64748b; margin-top: 12px; line-height: 1.5; }
        .save-toast { font-size: 0.85rem; color: #34d399; margin-top: 12px; display: none; font-weight: 500; }
        .menu-toggle { display: none; position: fixed; top: 20px; right: 20px; z-index: 60; width: 46px; height: 46px; border-radius: 14px; background: rgba(15, 20, 32, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .chat-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(8px); z-index: 100; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.3s ease; }
        .chat-overlay.active { display: flex; opacity: 1; }
        .chat-panel { width: 100%; max-width: 550px; height: 680px; max-height: 90vh; background: #0f1420; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 26px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); transform: translateY(20px); transition: transform 0.3s ease; }
        .chat-overlay.active .chat-panel { transform: translateY(0); }
        .chat-header { display: flex; align-items: center; padding: 18px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); background: rgba(255, 255, 255, 0.02); }
        .chat-header-info { flex: 1; min-width: 0; margin-left: 14px; }
        .chat-header-info h4 { font-size: 1.05rem; color: #fff; margin-bottom: 2px; }
        .chat-header-info p { font-size: 0.75rem; color: #10b981; display: flex; align-items: center; gap: 5px; }
        .chat-header-info p::before { content: ''; width: 6px; height: 6px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px rgba(16, 185, 129, 0.6); }
        .chat-header-actions { display: flex; gap: 8px; }
        .icon-btn { width: 38px; height: 38px; border-radius: 12px; border: none; background: rgba(255, 255, 255, 0.06); color: #94a3b8; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
        .chat-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
        .msg { max-width: 82%; padding: 14px 18px; border-radius: 20px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
        .msg.user { align-self: flex-end; background: linear-gradient(135deg, #0077b6, #00b4d8); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(0, 119, 182, 0.2); }
        .msg.ai { align-self: flex-start; background: rgba(255, 255, 255, 0.07); color: #e2e8f0; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); width: 100%; max-width: 90%; }
        .msg.system { align-self: center; background: rgba(255,255,255,0.05); color: #94a3b8; font-size: 0.75rem; text-align: center; padding: 6px 16px; border-radius: 20px; }
        .code-block-wrapper { background: #1e293b; border-radius: 10px; margin: 12px 0; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .code-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; background: #0f1420; color: #94a3b8; font-size: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .copy-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
        .copy-btn:hover { color: #fff; }
        .msg.ai pre { margin: 0; padding: 14px; background: transparent; border: none; overflow-x: auto; font-family: 'Courier New', Courier, monospace; font-size: 0.85rem; }
        .msg.ai :not(pre) > code { font-family: monospace; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 6px; color: #34d399; }
        .msg.ai p { margin-bottom: 10px; }
        .msg.ai p:last-child { margin-bottom: 0; }
        .typing-dots { align-self: flex-start; display: flex; gap: 6px; padding: 16px 20px; background: rgba(255, 255, 255, 0.07); border-radius: 20px; border-bottom-left-radius: 4px; }
        .typing-dots span { width: 7px; height: 7px; border-radius: 50%; background: #00b4d8; animation: blink 1.2s infinite ease-in-out; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.3; transform: scale(1); } 40% { opacity: 1; transform: scale(1.2); } }
        .chat-input-row { display: flex; gap: 12px; padding: 18px 20px; border-top: 1px solid rgba(255, 255, 255, 0.08); background: rgba(255, 255, 255, 0.02); }
        .chat-input-row textarea { flex: 1; resize: none; border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(0, 0, 0, 0.2); color: #f8f9fa; padding: 14px 18px; font-size: 0.95rem; font-family: inherit; outline: none; max-height: 120px; transition: border-color 0.2s; line-height: 1.4; }
        .chat-input-row textarea:focus { border-color: #00b4d8; }
        .send-btn { width: 50px; height: 50px; border-radius: 16px; border: none; background: linear-gradient(135deg, #0077b6, #00b4d8); color: #fff; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transition: transform 0.2s, box-shadow 0.2s; }
        .send-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 119, 182, 0.4); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .chat-error-banner { display: none; margin: 10px 20px 0; padding: 12px 16px; border-radius: 12px; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.25); color: #f87171; font-size: 0.85rem; align-items: center; gap: 10px; }
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
            .sidebar { position: fixed; top: 0; left: 0; height: 100vh; width: 280px; border-radius: 0 30px 30px 0; transform: translateX(-110%); z-index: 55; box-shadow: 5px 0 25px rgba(0,0,0,0.5); }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: flex; }
            body { padding: 15px; }
            main.main-content { padding-top: 60px; }
        }
        @media (max-width: 480px) {
            .chat-panel { height: 100%; max-height: 100vh; border-radius: 0; }
            .chat-overlay { padding: 0; }
            .user-info p { -webkit-line-clamp: 2; }
            .msg { max-width: 90%; }
        }
    </style>
</head>
<body>

    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
    </button>

    <div class="container">
        <aside class="sidebar" id="sidebar">
            <div class="logo-section">
                <div class="logo-placeholder"><i class="fas fa-brain"></i></div>
                <h2>HMMODZ AI</h2>
            </div>
            <nav style="width: 100%; margin-top: 40px; display: flex; flex-direction: column; gap: 10px;">
                <div class="nav-item active" data-view="dashboard"><i class="fas fa-home"></i> Dashboard</div>
                <div class="nav-item" data-view="settings"><i class="fas fa-cog"></i> Settings</div>
            </nav>
        </aside>

        <main class="main-content">
            <section class="view active" id="view-dashboard">
                <header>
                    <h1 style="font-size: 2rem; font-weight: 800; background: linear-gradient(to right, #fff, #778da9); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">hmmodz ai</h1>
                    <p style="color: #94a3b8; font-size: 0.95rem; margin-top: 5px;">Platform Chat AI Pintar, Cepat, dan Aman.</p>
                </header>

                <section class="user-list" id="userList">
                    <h3 style="margin-bottom: 25px; font-size: 1.2rem; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;">
                        <i class="fas fa-robot" style="margin-right: 12px; color: #00b4d8;"></i> Pilih AI Asisten
                    </h3>
                </section>
            </section>

            <section class="view" id="view-settings">
                <header>
                    <h1 style="font-size: 1.8rem; font-weight: 700;">Settings</h1>
                    <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 5px;">Konfigurasi Sistem</p>
                </header>
                <div class="settings-card">
                    <label for="apiKeyInput">Google AI (Gemini) API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="Tempel API key di sini..." autocomplete="off">
                    <p class="settings-hint"><i class="fas fa-shield-alt"></i> Key ini dienkripsi dan disimpan lokal di browser (localStorage) untuk keamanan kamu.</p>
                    <div class="settings-row">
                        <button class="btn btn-primary" id="saveKeyBtn"><i class="fas fa-save"></i> Simpan</button>
                        <button class="btn btn-ghost" id="toggleKeyVisibility"><i class="fas fa-eye"></i> Lihat</button>
                        <button class="btn btn-danger" id="clearKeyBtn"><i class="fas fa-trash-alt"></i> Hapus</button>
                    </div>
                    <p class="save-toast" id="saveToast"><i class="fas fa-check-circle"></i> Berhasil disimpan!</p>
                </div>
            </section>
        </main>
    </div>

    <div class="chat-overlay" id="chatOverlay">
        <div class="chat-panel">
            <div class="chat-header">
                <div class="profile-img-container" id="chatAvatarWrap" style="width: 45px; height: 45px; border-radius: 12px;"><img id="chatAvatar" src="" alt="Avatar"></div>
                <div class="chat-header-info">
                    <h4 id="chatName">-</h4><p id="chatStatus">Online</p>
                </div>
                <div class="chat-header-actions">
                    <button class="icon-btn" id="clearChatBtn" title="Bersihkan Obrolan"><i class="fas fa-broom"></i></button>
                    <button class="icon-btn" id="closeChatBtn" title="Tutup Chat"><i class="fas fa-times"></i></button>
                </div>
            </div>
            
            <div class="chat-error-banner" id="chatErrorBanner"></div>
            <div class="chat-body" id="chatBody"></div>
            
            <div class="chat-input-row">
                <textarea id="chatInput" rows="1" placeholder="Tulis pesan... (Gunakan Shift+Enter untuk baris baru)"></textarea>
                <button class="send-btn" id="sendBtn" title="Kirim Pesan"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const BOTS = [
            {
                id: 'human-ai-771', name: 'human-ai-771', desc: 'Berbicara Seperti Manusia dan memiliki logika', img: '1.png', fallback: 'https://ui-avatars.com/api/?name=AI+771&background=0077b6&color=fff', badge: 'Working',
                system: 'Kamu adalah asisten AI yang membalas pesan layaknya manusia biasa saat chatting. Jawablah dengan SANGAT RINGKAS, langsung ke intinya, maksimal 1-2 kalimat pendek. Jangan bertele-tele.'
            },
            {
                id: 'human-ai-627', name: 'human-ai-627', desc: 'Asisten santai untuk ngobrol sehari-hari', img: '2.png', fallback: 'https://ui-avatars.com/api/?name=AI+627&background=e76f51&color=fff', badge: 'Standby',
                system: 'Kamu adalah teman ngobrol. Gunakan bahasa gaul yang santai. Balasan harus super singkat, maksimal 15 kata.'
            },
            {
                id: 'agi-beta', name: 'AGI BETA', desc: 'Projects AGI', img: '3.png', fallback: 'https://ui-avatars.com/api/?name=AGI+BETA&background=2a9d8f&color=fff', badge: 'Working',
                system: 'Kamu adalah AI eksperimental untuk brainstorming. Berikan jawaban langsung berupa poin-poin singkat dan jelas. Jangan memberikan intro.'
            },
            {
                id: 'human-ai-hanz-ofc', name: 'human-ai-hanz-ofc', desc: 'Bot Logika Dan Code', img: 'logo.png', fallback: 'https://ui-avatars.com/api/?name=AI+829&background=2a9d8f&color=fff', badge: 'Working',
                system: 'Kamu adalah asisten AI programmer tingkat lanjut. Jawab langsung dengan solusi atau kode. Penjelasan maksimal 2 kalimat pendek. Dilarang bertele-tele.'
            }
        ];
        
        const MODEL = 'gemini-1.5-flash-latest'; 
        
        const userList = document.getElementById('userList');
        BOTS.forEach(bot => {
            const item = document.createElement('div'); item.className = 'user-item'; item.dataset.botId = bot.id;
            item.innerHTML = `<div class="profile-img-container"><img src="${bot.img}" alt="Profile" onerror="this.src='${bot.fallback}'"></div>
                <div class="user-info"><h4>${bot.name}</h4><p>${bot.desc}</p></div>
                <span class="badge" style="${bot.badge === 'Standby' ? 'background: rgba(148, 163, 184, 0.1); color: #94a3b8;' : ''}">${bot.badge}</span>`;
            item.addEventListener('click', () => openChat(bot.id)); userList.appendChild(item);
        });

        const navItems = document.querySelectorAll('.nav-item'); const views = document.querySelectorAll('.view');
        navItems.forEach(nav => {
            nav.addEventListener('click', () => {
                navItems.forEach(n => n.classList.remove('active')); nav.classList.add('active');
                views.forEach(v => v.classList.remove('active')); document.getElementById('view-' + nav.dataset.view).classList.add('active');
                if (window.innerWidth <= 900) closeSidebar();
            });
        });
        const sidebar = document.getElementById('sidebar'); const menuToggle = document.getElementById('menuToggle');
        function openSidebar() { sidebar.classList.add('open'); } function closeSidebar() { sidebar.classList.remove('open'); }
        menuToggle.addEventListener('click', (e) => { e.stopPropagation(); sidebar.classList.contains('open') ? closeSidebar() : openSidebar(); });
        document.addEventListener('click', (e) => { if (window.innerWidth <= 900 && sidebar.classList.contains('open')) { if (!sidebar.contains(e.target) && e.target !== menuToggle) { closeSidebar(); } } });

        const apiKeyInput = document.getElementById('apiKeyInput'); const saveKeyBtn = document.getElementById('saveKeyBtn'); const clearKeyBtn = document.getElementById('clearKeyBtn'); const toggleKeyVisibility = document.getElementById('toggleKeyVisibility'); const saveToast = document.getElementById('saveToast');
        apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
        saveKeyBtn.addEventListener('click', () => { const val = apiKeyInput.value.trim(); if (!val) return; localStorage.setItem('gemini_api_key', val); saveToast.style.display = 'block'; setTimeout(() => saveToast.style.display = 'none', 3000); });
        clearKeyBtn.addEventListener('click', () => { localStorage.removeItem('gemini_api_key'); apiKeyInput.value = ''; });
        toggleKeyVisibility.addEventListener('click', () => { const isPassword = apiKeyInput.type === 'password'; apiKeyInput.type = isPassword ? 'text' : 'password'; toggleKeyVisibility.innerHTML = isPassword ? '<i class="fas fa-eye-slash"></i> Sembunyikan' : '<i class="fas fa-eye"></i> Lihat'; });

        let currentBot = null;
        const chatOverlay = document.getElementById('chatOverlay'); const chatBody = document.getElementById('chatBody'); const chatName = document.getElementById('chatName'); const chatAvatar = document.getElementById('chatAvatar'); const chatInput = document.getElementById('chatInput'); const sendBtn = document.getElementById('sendBtn'); const closeChatBtn = document.getElementById('closeChatBtn'); const clearChatBtn = document.getElementById('clearChatBtn'); const chatErrorBanner = document.getElementById('chatErrorBanner');

        function historyKey(botId) { return 'chat_history_' + botId; }
        function loadHistory(botId) { try { const data = localStorage.getItem(historyKey(botId)); if (!data) return []; const parsed = JSON.parse(data); return Array.isArray(parsed) ? parsed : []; } catch (e) { return []; } }
        function saveHistory(botId, history) { localStorage.setItem(historyKey(botId), JSON.stringify(history)); }
        
        window.copyCode = function(btn) {
            const pre = btn.closest('.code-block-wrapper').querySelector('pre');
            const code = pre.innerText;
            navigator.clipboard.writeText(code).then(() => {
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
            });
        };

        function renderHistory(botId) {
            chatBody.innerHTML = ''; const history = loadHistory(botId);
            if (history.length === 0) { appendSystemMsg('<i class="fas fa-shield-check"></i> Obrolan dilindungi dengan enkripsi lokal. Mulai percakapan!'); } 
            else { history.forEach(m => appendMsg(m.role, m.text, false)); }
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function appendMsg(role, text, scroll = true) { 
            const div = document.createElement('div'); 
            div.className = 'msg ' + (role === 'user' ? 'user' : 'ai'); 
            
            if (role === 'ai') {
                let parsedHTML = marked.parse(text);
                let safeHTML = DOMPurify.sanitize(parsedHTML);
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(safeHTML, 'text/html');
                
                doc.querySelectorAll('pre').forEach(pre => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'code-block-wrapper';
                    
                    const header = document.createElement('div');
                    header.className = 'code-header';
                    header.innerHTML = '<span>Code</span><button class="copy-btn" onclick="copyCode(this)"><i class="fas fa-copy"></i> Copy</button>';
                    
                    pre.parentNode.insertBefore(wrapper, pre);
                    wrapper.appendChild(header);
                    wrapper.appendChild(pre);
                });
                
                div.innerHTML = doc.body.innerHTML;
            } else {
                div.textContent = text;
            }
            
            chatBody.appendChild(div); 
            if (scroll) chatBody.scrollTop = chatBody.scrollHeight; 
        }

        function appendSystemMsg(text) { const div = document.createElement('div'); div.className = 'msg system'; div.innerHTML = text; chatBody.appendChild(div); }
        function showTyping() { const div = document.createElement('div'); div.className = 'typing-dots'; div.id = 'typingIndicator'; div.innerHTML = '<span></span><span></span><span></span>'; chatBody.appendChild(div); chatBody.scrollTop = chatBody.scrollHeight; }
        function hideTyping() { const el = document.getElementById('typingIndicator'); if (el) el.remove(); }
        function showChatError(msg) { chatErrorBanner.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${msg}`; chatErrorBanner.style.display = 'flex'; }
        function hideChatError() { chatErrorBanner.style.display = 'none'; }

        function openChat(botId) {
            currentBot = BOTS.find(b => b.id === botId); if (!currentBot) return;
            chatName.textContent = currentBot.name; chatAvatar.src = currentBot.img; chatAvatar.onerror = () => { chatAvatar.src = currentBot.fallback; };
            hideChatError(); renderHistory(botId); chatOverlay.classList.add('active'); setTimeout(() => chatInput.focus(), 100);
        }
        function closeChat() { chatOverlay.classList.remove('active'); currentBot = null; }
        closeChatBtn.addEventListener('click', closeChat); chatOverlay.addEventListener('click', (e) => { if (e.target === chatOverlay) closeChat(); });

        clearChatBtn.addEventListener('click', () => {
            if (!currentBot) return;
            if(confirm("Yakin ingin menghapus seluruh obrolan dengan bot ini?")) {
                localStorage.removeItem(historyKey(currentBot.id));
                renderHistory(currentBot.id);
                hideChatError();
            }
        });

        chatInput.addEventListener('input', () => { chatInput.style.height = 'auto'; chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px'; });
        chatInput.addEventListener('keydown', (e) => { 
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); sendMessage(); 
            } 
        });
        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || !currentBot) return;

            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) { showChatError('Oops! API Key belum terpasang. Cek menu Settings ya.'); return; }
            hideChatError();

            chatInput.value = ''; chatInput.style.height = 'auto'; chatInput.focus();
            appendMsg('user', text);

            const history = loadHistory(currentBot.id);
            history.push({ role: 'user', text });
            saveHistory(currentBot.id, history);

            sendBtn.disabled = true;
            showTyping();

            try {
                const contents = history.map(m => ({
                    role: m.role === 'user' ? 'user' : 'model',
                    parts: [{ text: m.text }]
                }));

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents,
                        systemInstruction: { parts: [{ text: currentBot.system }] },
                        generationConfig: { temperature: 0.7, maxOutputTokens: 2000 }
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => null);
                    const errMsg = errData && errData.error && errData.error.message ? `Error: ${errData.error.message}` : `Gagal menghubungi server (HTTP ${response.status})`;
                    throw new Error(errMsg);
                }

                const data = await response.json();
                const replyText = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text ? data.candidates[0].content.parts[0].text : '(Tidak ada respons)';

                hideTyping();
                appendMsg('ai', replyText);

                const updatedHistory = loadHistory(currentBot.id);
                updatedHistory.push({ role: 'model', text: replyText });
                saveHistory(currentBot.id, updatedHistory);

            } catch (err) {
                hideTyping();
                showChatError(err.message);
                
                const rollbackHistory = loadHistory(currentBot.id);
                if(rollbackHistory.length > 0 && rollbackHistory[rollbackHistory.length-1].role === 'user') {
                    rollbackHistory.pop(); saveHistory(currentBot.id, rollbackHistory);
                }
            } finally {
                sendBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
