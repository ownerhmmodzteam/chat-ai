<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lya AI - Fixed Keyboard</title>
    <style>
        :root {
            --ios-pink: #ff69b4;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --deep-blue: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background: var(--deep-blue);
            background-image: radial-gradient(circle at 50% -20%, #1e40af, #0f172a);
            /* Gunakan height 100% dan overflow hidden pada body */
            height: 100%;
            width: 100%;
            position: fixed;
            overflow: hidden;
            color: white;
        }

        .app-container {
            /* Kita akan atur tingginya lewat JS agar akurat */
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .ios-navbar {
            padding: 15px 20px;
            padding-top: env(safe-area-inset-top, 20px);
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid var(--glass-border);
            z-index: 100;
        }

        .ai-info { display: flex; align-items: center; gap: 12px; }
        .avatar-nav { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--ios-pink); object-fit: cover; }
        .ai-meta h2 { font-size: 1rem; font-weight: 600; }
        .ai-meta p { font-size: 0.7rem; color: #10b981; }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            /* Padding bottom diperbesar agar tidak tertutup input bar */
            padding-bottom: 80px; 
            -webkit-overflow-scrolling: touch;
        }

        .msg-wrapper { display: flex; gap: 8px; max-width: 85%; animation: fadeIn 0.3s ease; }
        .msg-wrapper.user { align-self: flex-end; flex-direction: row-reverse; }
        .avatar-msg { width: 30px; height: 30px; border-radius: 50%; align-self: flex-end; }
        .message { padding: 10px 16px; border-radius: 20px; font-size: 0.95rem; line-height: 1.45; }
        .ai-message { background: var(--glass-bg); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }
        .user-message { background: linear-gradient(180deg, #0084ff 0%, #007aff 100%); border-bottom-right-radius: 4px; }

        /* Area Input yang akan selalu menempel di atas keyboard */
        .input-area {
            width: 100%;
            padding: 10px 15px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid var(--glass-border);
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }

        .input-box {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 5px 6px 5px 16px;
            border: 0.5px solid var(--glass-border);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 10px 0;
            outline: none;
            /* Font 16px adalah WAJIB agar iOS tidak auto-zoom */
            font-size: 16px; 
        }

        .send-btn {
            background: var(--ios-pink);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .send-btn svg { width: 18px; height: 18px; fill: none; stroke: white; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="app-container" id="app-container">
    <div class="ios-navbar">
        <div class="ai-info">
            <img src="https://i.pravatar.cc/150?u=cuteai" class="avatar-nav">
            <div class="ai-meta">
                <h2>Lya-chan</h2>
                <p>Online</p>
            </div>
        </div>
    </div>

    <div id="chat-container">
        <div class="msg-wrapper ai">
            <img src="https://i.pravatar.cc/150?u=cuteai" class="avatar-msg">
            <div class="message ai-message">Umm... halo. Namaku Lya. Sudah tidak tenggelam lagi kan? (〃▽〃)</div>
        </div>
    </div>

    <div class="input-area" id="input-area">
        <div class="input-box">
            <input type="text" id="user-input" placeholder="Tulis pesan..." autocomplete="off">
            <button class="send-btn" id="send-btn">
                <svg viewBox="0 0 24 24"><path d="M12 19V5M12 5L5 12M12 5L19 12"/></svg>
            </button>
        </div>
    </div>
</div>

<script>
    const appContainer = document.getElementById('app-container');
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    const apiKey = "KODE_API_GEMINI_KAMU"; 
    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

    // FIX KEYBOARD: Fungsi untuk mengatur tinggi container sesuai Visual Viewport
    function fixViewport() {
        if (window.visualViewport) {
            const vv = window.visualViewport;
            appContainer.style.height = vv.height + "px";
            // Geser container ke atas sejauh viewport offset
            appContainer.style.top = vv.offsetTop + "px";
            window.scrollTo(0, 0);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    }

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', fixViewport);
        window.visualViewport.addEventListener('scroll', fixViewport);
    }
    // Jalankan saat pertama load
    fixViewport();

    function addMessage(text, isUser) {
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${isUser ? 'user' : 'ai'}`;
        const avatar = isUser ? '' : `<img src="https://i.pravatar.cc/150?u=cuteai" class="avatar-msg">`;
        wrapper.innerHTML = `${avatar}<div class="message ${isUser ? 'user-message' : 'ai-message'}">${text}</div>`;
        chatContainer.appendChild(wrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;
        addMessage(text, true);
        userInput.value = '';
        
        // Tetap fokus setelah kirim agar keyboard tidak naik turun (opsional)
        // userInput.focus(); 

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "Lya, jawab dengan imut & pemalu: " + text }] }]
                })
            });
            const data = await response.json();
            addMessage(data.candidates[0].content.parts[0].text, false);
        } catch (e) {
            addMessage("Umm... koneksinya lagi malu-malu... (｡>﹏<｡)", false);
        }
    }

    sendBtn.onclick = handleSend;
    userInput.onkeypress = (e) => { if(e.key === 'Enter') handleSend(); };

    // Anti-zoom tambahan
    document.addEventListener('touchstart', (e) => {
        if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
</script>
</body>
</html>
